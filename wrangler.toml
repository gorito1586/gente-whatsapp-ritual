name = "gente-whatsapp-ritual"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "STATE"
id = "f9e8c7cf01e243778df8bc9b949f14ec"

[vars]
STORE_URL = "https://ritualdiarioec.store"
CLAUDE_MODEL = "claude-opus-5-5"
CLAUDE_EFFORT = "low"
PAUSE_HOURS = "12"
GRAPH_API_VERSION = "v23.0"
SHOPIFY_API_VERSION = "2026-07"

# Secretos (no van en este archivo). Se cargan en Cloudflare → Settings →
# Variables and Secrets: D360_API_KEY, WHATSAPP_VERIFY_TOKEN,
# SHOPIFY_STORE_DOMAIN, SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET,
# ANTHROPIC_API_KEY, LUIS_PHONE.
